name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  vibe-check:
    name: Vibe Check Code Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vibe Check Code Scanner
        id: vibe
        uses: holeyfield33-art/vibe-check@v1
        with:
          path: .
          fail-on: hard
          report: vibe-check-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-check-report
          path: vibe-check-report.json
          if-no-files-found: ignore
