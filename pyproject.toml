[project]
name = "atg"
version = "0.1.0"
description = "Aletheia Token Guard — slim MCP server for token/usage awareness and durable work checkpoints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aletheia Sovereign Systems" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
atg = "atg.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atg*"]
